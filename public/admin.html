<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - PixelStore</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- ===== APP ===== -->
    <div id="app"></div>

    <!-- ===== SCRIPTS ===== -->
    <script src="data.js"></script>
    <script src="components.js"></script>
    <script src="app.js"></script>

    <!-- ===== FORZAR ADMIN ===== -->
    <script>
        // FORZAR QUE LA PÁGINA SEA ADMIN
        document.addEventListener('DOMContentLoaded', function() {
            // Esperar a que App se inicialice
            setTimeout(function() {
                // Forzar página admin
                App.state.page = 'admin';
                
                // Si hay usuario, forzar rol
                if (App.state.currentUser) {
                    App.state.currentUser.role = 'administrador';
                }
                
                // Renderizar
                App.render();
                
                // Mostrar mensaje de depuración
                console.log('✅ ADMIN FORZADO - Page:', App.state.page);
                console.log('✅ ADMIN FORZADO - User:', App.state.currentUser);
                
            }, 100);
        });
    </script>
</body>
</html>
