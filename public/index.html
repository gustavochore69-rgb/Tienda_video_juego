<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelStore – Tu tienda de videojuegos</title>
  <meta name="description" content="PixelStore: encuentra tus juegos favoritos, ofertas exclusivas y las últimas novedades en videojuegos y consolas." />
  <meta property="og:title" content="PixelStore – Tu tienda de videojuegos" />
  <meta property="og:description" content="Juega más, paga menos. Tienda digital con juegos, consolas y mucho más." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" style="display:flex;flex-direction:column;min-height:100vh;"></div>

  <script src="data.js"></script>
  <script src="components.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener('submit', async (e) => {
      const form = e.target;
      
      // Selectores flexibles por ID, tipo o atributo name
      const inputEmail = form.querySelector('#login-user, #reg-email, input[type="email"], input[name="email"], input[name="correo"], input[type="text"]');
      const inputPassword = form.querySelector('#login-pass, #reg-password, input[type="password"], input[name="password"], input[name="contra"]');
      const inputNombre = form.querySelector('#reg-fullname, input[name="nombre"], input[name="fullName"], input[name="nombreCompleto"]');

      // 1. EVALUAR SI ES FORMULARIO DE REGISTRO
      const esFormularioRegistro = form.id === 'register-form' || 
                                   form.querySelector('button[type="submit"]')?.textContent.toLowerCase().includes('crear') || 
                                   form.querySelector('button[type="submit"]')?.textContent.toLowerCase().includes('registrar') ||
                                   Boolean(inputNombre);

      if (esFormularioRegistro && inputEmail && inputPassword && inputNombre) {
        e.preventDefault();
        e.stopImmediatePropagation();

        const nombreCompleto = inputNombre.value.trim();
        const correo = inputEmail.value.trim();
        const contra = inputPassword.value;

        if (!nombreCompleto || !correo || !contra) {
          alert('Por favor completa todos los campos requeridos.');
          return;
        }

        const partesNombre = nombreCompleto.split(' ');
        const nombre = partesNombre[0] || 'Cliente';
        const apellido = partesNombre.slice(1).join(' ') || 'Sin Apellido';

        try {
          const res = await fetch('/api/registro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, apellido, correo, contra })
          });

          const result = await res.json();

          if (res.ok) {
            alert('¡Cliente guardado correctamente en MySQL!');
            window.location.reload();
          } else {
            alert('Error en MySQL: ' + (result.error || 'No se pudo guardar el registro'));
          }
        } catch (err) {
          console.error('Error de conexión:', err);
          alert('Error al conectar con la base de datos.');
        }
        return;
      }

      // 2. EVALUAR SI ES FORMULARIO DE LOGIN
      const esFormularioLogin = form.id === 'login-form' || 
                                form.querySelector('button[type="submit"]')?.textContent.toLowerCase().includes('iniciar') ||
                                (inputEmail && inputPassword && !inputNombre);

      if (esFormularioLogin && inputEmail && inputPassword) {
        e.preventDefault();
        e.stopImmediatePropagation();

        const correo = inputEmail.value.trim();
        const contra = inputPassword.value;

        if (!correo || !contra) {
          const errEl = document.getElementById('login-error');
          if (errEl) {
            errEl.textContent = 'Ingresa tu correo y contraseña.';
            errEl.style.display = 'block';
          } else {
            alert('Ingresa tu correo y contraseña.');
          }
          return;
        }

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo, contra })
          });

          const result = await res.json();

          if (res.ok) {
            // Estructura requerida por la plantilla
            const usuarioSesion = {
              id: result.cliente.id,
              fullName: `${result.cliente.nombre} ${result.cliente.apellido}`.trim(),
              username: result.cliente.nombre,
              email: result.cliente.correo,
              role: 'client',
              createdAt: new Date().toLocaleDateString('es-ES', { month: 'short', year: 'numeric' })
            };

            // Guardar sesión en el almacenamiento local
            localStorage.setItem('pixelstore_user', JSON.stringify(usuarioSesion));
            localStorage.setItem('currentUser', JSON.stringify(usuarioSesion));
            localStorage.setItem('usuario', JSON.stringify(usuarioSesion));
            localStorage.setItem('ps_current_user', JSON.stringify(usuarioSesion));

            alert('¡Bienvenido, ' + result.cliente.nombre + '!');
            window.location.reload();
          } else {
            const errEl = document.getElementById('login-error');
            if (errEl) {
              errEl.textContent = result.error || 'Credenciales inválidas';
              errEl.style.display = 'block';
            } else {
              alert('Error de acceso: ' + (result.error || 'Credenciales inválidas'));
            }
          }
        } catch (err) {
          console.error('Error de conexión:', err);
          alert('Error al conectar con la base de datos.');
        }
      }
    }, true);
  </script>

</body>
</html>
